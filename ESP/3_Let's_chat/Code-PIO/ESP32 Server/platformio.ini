; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:LonelyB-ESP32Wrover]

platform = espressif32@6.11.0
; platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = LonelyB-ESP32Wrover
framework = arduino
lib_ldf_mode = deep
board_build.partitions = default.csv
board_build.filesystem = littlefs
build_flags = -D USE_GFX_LITE
lib_deps =
	ottowinter/ESPAsyncWebServer-esphome@^3.3.0
	tzapu/WiFiManager@^2.0.17
	contrem/arduino-timer@^3.0.1
	adafruit/Adafruit NeoPixel @ ^1.12.5
	bitbank2/AnimatedGIF@^2.2.0
	https://github.com/mrfaptastic/ESP32-HUB75-MatrixPanel-I2S-DMA.git
	https://github.com/mrcodetastic/GFX_Lite
	; https://github.com/s-marley/ESP32-INMP441-Matrix-VU
	https://github.com/AaronLiddiment/LEDMatrix
    https://github.com/AaronLiddiment/LEDText
  	; kosme/arduinoFFT@^2.0.4
	trylaarsdam/PowerInBand@^1.1.0
	fastled/FastLED@^3.10.3
	

monitor_speed = 115200
upload_speed = 921600

